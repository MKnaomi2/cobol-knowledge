    year: 2013
    publisher: Micro Focus
    independence: vendor
    method: Vendor press release citing internal and third-party figures.
    notes: Bundle of marketing statistics (90% Fortune 500, 95% ATM, etc.) without a public microdata file.

  - id: iso-iec-1989-2023
    title: "ISO/IEC 1989:2023 Information technology — Programming language COBOL"
