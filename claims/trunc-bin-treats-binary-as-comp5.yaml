id: trunc-bin-treats-binary-as-comp5
title: TRUNC(BIN) treats BINARY, COMP, and COMP-4 as COMP-5
kind: operational
status: proposed
confidence: high
topics: [runtime, data, dialect]
statement: >
  The TRUNC(BIN) compiler option causes all binary data items (USAGE
  BINARY, COMP, COMP-4) to be handled as if they were declared USAGE
  COMP-5. TRUNC itself has no effect on COMP-5 data items; COMP-5 items
  are handled as if TRUNC(BIN) is in effect regardless of the TRUNC
  suboption specified.
