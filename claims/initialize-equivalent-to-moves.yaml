id: initialize-equivalent-to-moves
title: INITIALIZE is functionally equivalent to one or more MOVE statements
kind: operational
status: proposed
confidence: high
topics: [syntax, data]
statement: >
  An INITIALIZE statement is functionally equivalent to one or more
  MOVE statements. Applied to a group item, it initializes subordinate
  elementary items by category. If REPLACING is not coded, SPACE is the
  implied sending item for alphabetic, alphanumeric, alphanumeric-edited,
  DBCS, category national, and national-edited receiving items, and ZERO
  is the implied sending item for numeric and numeric-edited receiving
  items. When FILLER is specified, receiving elementary items that have
  an explicit or implicit FILLER clause are initialized. When an
  alphanumeric or national group is INITIALIZEd, it is processed with
  group semantics and the elementary items within the group are
  recognized and processed.
sources:
