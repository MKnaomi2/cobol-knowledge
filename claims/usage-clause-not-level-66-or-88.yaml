id: usage-clause-not-level-66-or-88
title: USAGE may be specified at any level except 66 or 88
kind: operational
status: proposed
confidence: high
topics: [syntax, data]
statement: >
  The USAGE clause specifies the format in which data is represented in
  storage. It can be specified for a data description entry with any
  level-number other than 66 or 88. When specified at the group level,
  USAGE applies to each elementary item in the group. The usage of
  elementary items must not contradict the usage of a group to which
  they belong. When USAGE is not specified at either the group or
  elementary level, DISPLAY is implied when the PICTURE contains only
  symbols other than G or N; NATIONAL is implied when the PICTURE
  contains only N and NSYMBOL(NATIONAL) is in effect; DISPLAY-1 is
  implied when the PICTURE contains one or more N and NSYMBOL(DBCS)
  is in effect. NATIVE is treated as a comment in all USAGE phrases
  for which NATIVE is shown.
