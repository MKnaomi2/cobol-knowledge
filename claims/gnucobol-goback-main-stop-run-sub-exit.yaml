      - "If executed within a main program, GOBACK will act as a STOP RUN statement."
      - "If executed by a main program, neither the EXIT PROGRAM nor EXIT FUNCTION statements will take any action."
      - "the GOBACK statement should be strongly considered as the preferred alternative to both EXIT PROGRAM and EXIT FUNCTION for new subprograms."
