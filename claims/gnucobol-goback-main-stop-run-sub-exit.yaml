id: gnucobol-goback-main-stop-run-sub-exit
title: In GnuCOBOL, GOBACK is STOP RUN in a main program and EXIT PROGRAM in a subprogram
kind: operational
status: proposed
confidence: medium
topics: [dialect, runtime, syntax]
statement: >
  In the GnuCOBOL Programmer's Guide, GOBACK logically terminates an
  executing program. If executed within a subprogram (a subroutine or
  user-defined function), GOBACK behaves like EXIT PROGRAM or EXIT
  FUNCTION respectively. If executed within a main program, GOBACK acts
  as STOP RUN. If executed by a main program, neither EXIT PROGRAM nor
  EXIT FUNCTION takes any action. The guide presents GOBACK as the
  preferred alternative to EXIT PROGRAM and EXIT FUNCTION for new
  subprograms. The GnuCOBOL FAQ states that unlike STOP RUN, GOBACK
  will properly unwind nested programs and only return to the operating
  system when it occurs in a top-level program.
