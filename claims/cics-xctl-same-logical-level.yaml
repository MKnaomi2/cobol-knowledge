id: cics-xctl-same-logical-level
title: EXEC CICS XCTL transfers control at the same logical level and releases the caller
kind: operational
status: proposed
confidence: medium
topics: [cics]
statement: >
  In the CICS/ESA 4.1 Application Programming Reference, XCTL transfers
  control from one application program to another at the same logical level.
  The program from which control is transferred is released. If the target
  program is not already in main storage, it is loaded.
