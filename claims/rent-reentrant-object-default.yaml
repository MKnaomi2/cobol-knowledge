id: rent-reentrant-object-default
title: RENT (the default) generates a reentrant object program
kind: operational
status: proposed
confidence: high
topics: [runtime]
statement: >
  A program compiled as RENT is generated as a reentrant object program.
  A program compiled as NORENT is generated as a nonreentrant object
  program. Either can be invoked as a main program or as a subprogram.
  Default is RENT. Compile programs with RENT if they will be run in
  virtual storage addresses above 16 MB. Execution of nonreentrant
  programs above 16 MB is not supported. Programs compiled with NORENT
  must be RMODE 24. The LP(64) compiler option implies RENT; if the
  user explicitly specifies NORENT, an informational message is issued
  and the setting is ignored.
