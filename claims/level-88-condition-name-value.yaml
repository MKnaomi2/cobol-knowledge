id: level-88-condition-name-value
title: Level-88 entries name values of a preceding conditional variable
kind: operational
status: proposed
confidence: high
topics: [syntax, data]
statement: >
  Format 2 of the VALUE clause associates a value, values, or ranges of
  values with a condition-name. Each such condition-name requires a
  separate level-88 entry. The VALUE clause is required in a
  condition-name entry and must be the only clause in the entry. Every
  level-88 entry must be preceded either by the entry for the
  conditional variable or by another level-88 entry when several
  condition-names apply to one variable. Each level-88 entry implicitly
  has the PICTURE characteristics of the conditional variable. THROUGH
  and THRU are equivalent. When THROUGH is used, literal-1 must be less
  than literal-2.
