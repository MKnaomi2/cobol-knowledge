id: copy-nested-one-replacing
title: A nested COPY chain may contain only one COPY REPLACING
kind: operational
status: proposed
confidence: high
topics: [syntax]
statement: >
  COPY statements can be nested. Any COPY statement in a chain of nested
  COPY statements can have the REPLACING phrase, as long as there is
  only one COPY statement in the chain that includes REPLACING. Only one
  COPY REPLACING statement is allowed in a nested COPY chain. A second
  COPY REPLACING in the same nested chain is a severe-level compiler
  error (RC=12) and produces IGYLI0078-S; the second COPY statement is
  discarded.
