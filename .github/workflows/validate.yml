name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Validate ledger
        run: python scripts/validate.py
      - name: Tests
        run: python -m pytest -q
